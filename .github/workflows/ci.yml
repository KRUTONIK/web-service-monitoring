name: CI

on:
  push:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  go-quality:
    name: Go quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/api/go.mod
            services/checker/go.mod
            services/notification/go.mod

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l services)

          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: |
          go vet ./services/api/...
          go vet ./services/checker/...
          go vet ./services/notification/...

      - name: Run Go tests with coverage
        run: |
          go test -coverprofile=services/api/coverage.out ./services/api/...
          go test -coverprofile=services/checker/coverage.out ./services/checker/...
          go test -coverprofile=services/notification/coverage.out ./services/notification/...

      - name: Show coverage
        run: |
          echo "API Service:"
          go tool cover -func=services/api/coverage.out

          echo "Checker Service:"
          go tool cover -func=services/checker/coverage.out

          echo "Notification Service:"
          go tool cover -func=services/notification/coverage.out

      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        with:
          name: go-coverage
          path: |
            services/api/coverage.out
            services/checker/coverage.out
            services/notification/coverage.out

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run ESLint
        working-directory: web
        run: npm run lint

      - name: Build Web UI
        working-directory: web
        run: npm run build

  go-lint:
    name: Go lint (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - services/api
          - services/checker
          - services/notification

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: ${{ matrix.service }}/go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: ${{ matrix.service }}

  build:
    name: Build application
    runs-on: ubuntu-latest

    needs:
      - commitlint
      - go-quality
      - go-lint
      - web-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/api/go.mod
            services/checker/go.mod
            services/notification/go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web UI dependencies
        working-directory: web
        run: npm ci

      - name: Build Go services
        run: |
          mkdir -p build/services

          go build -o build/services/api ./services/api
          go build -o build/services/checker ./services/checker
          go build -o build/services/notification ./services/notification

      - name: Build Web UI
        working-directory: web
        run: npm run build

      - name: Prepare Web UI artifact
        run: |
          mkdir -p build/web
          cp -r web/dist/. build/web/

      - name: Upload application build
        uses: actions/upload-artifact@v6
        with:
          name: application-build
          path: build/

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install commitlint
        run: npm ci

      - name: Validate commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to "${{ github.event.pull_request.head.sha }}" \
              --verbose
          else
            BEFORE="${{ github.event.before }}"

            if [[ "$BEFORE" =~ ^0+$ ]]; then
              git log -1 --pretty=%B | npx commitlint
            else
              npx commitlint \
                --from "$BEFORE" \
                --to "${{ github.sha }}" \
                --verbose
            fi
          fi