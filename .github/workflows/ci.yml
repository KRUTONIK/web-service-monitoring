name: CI

on:
  push:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  actions: read

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install commitlint
        run: npm ci

      - name: Validate commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to "${{ github.event.pull_request.head.sha }}" \
              --verbose
          else
            BEFORE="${{ github.event.before }}"

            if [[ "$BEFORE" =~ ^0+$ ]]; then
              git log -1 --pretty=%B | npx commitlint
            else
              npx commitlint \
                --from "$BEFORE" \
                --to "${{ github.sha }}" \
                --verbose
            fi
          fi

  go-quality:
    name: Go quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/api/go.mod
            services/checker/go.mod
            contracts/go.mod
            services/metrics/go.mod
            services/notification/go.mod

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l contracts/gen services)

          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: |
          go vet ./services/api/...
          go vet ./services/checker/...
          go vet ./services/metrics/...
          go vet ./services/notification/...

      - name: Run Go tests with coverage
        run: |
          go test -coverprofile=services/api/coverage.out ./services/api/...
          go test -coverprofile=services/checker/coverage.out ./services/checker/...
          go test -coverprofile=services/metrics/coverage.out ./services/metrics/...
          go test -coverprofile=services/notification/coverage.out ./services/notification/...

      - name: Show coverage
        run: |
          echo "API Service:"
          go tool cover -func=services/api/coverage.out

          echo "Checker Service:"
          go tool cover -func=services/checker/coverage.out

          echo "Notification Service:"
          go tool cover -func=services/notification/coverage.out

          echo "Metrics Service:"
          go tool cover -func=services/metrics/coverage.out

      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        with:
          name: go-coverage
          path: |
            services/api/coverage.out
            services/checker/coverage.out
            services/metrics/coverage.out
            services/notification/coverage.out

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run ESLint
        working-directory: web
        run: npm run lint

      - name: Build Web UI
        working-directory: web
        run: npm run build

  go-lint:
    name: Go lint (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - services/api
          - services/checker
          - services/metrics
          - services/notification

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: ${{ matrix.service }}/go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: ${{ matrix.service }}

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run infrastructure integration tests
        shell: bash
        run: bash scripts/integration-test.sh

      - name: Run prototype integration test
        shell: bash
        run: bash scripts/prototype-test.sh

  build:
    name: Build application
    runs-on: ubuntu-latest

    needs:
      - commitlint
      - go-quality
      - go-lint
      - web-quality
      - integration-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/api/go.mod
            services/checker/go.mod
            contracts/go.mod
            services/metrics/go.mod
            services/notification/go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web UI dependencies
        working-directory: web
        run: npm ci

      - name: Build Go services
        run: |
          mkdir -p build/services

          go build -o build/services/api ./services/api/cmd/api
          go build -o build/services/checker ./services/checker/cmd/checker
          go build -o build/services/metrics ./services/metrics/cmd/metrics
          go build -o build/services/notification ./services/notification

      - name: Build Web UI
        working-directory: web
        run: npm run build

      - name: Prepare Web UI artifact
        run: |
          mkdir -p build/web
          cp -r web/dist/. build/web/

      - name: Upload application build
        uses: actions/upload-artifact@v6
        with:
          name: application-build
          path: build/

  metrics:
    name: Quality metrics
    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/api/go.mod
            services/checker/go.mod
            contracts/go.mod
            services/metrics/go.mod
            services/notification/go.mod

      - name: Install complexity analyzer
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

      - name: Collect quality metrics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p metrics/generated

          set +e

          go test -json \
            -coverprofile=metrics/generated/coverage.out \
            ./services/api/... \
            ./services/checker/... \
            ./services/metrics/... \
            ./services/notification/... \
            > metrics/generated/tests.json

          TEST_EXIT=$?

          set -e

          PASSED=$(jq -s \
            '[.[] | select(.Test != null and .Action == "pass")] | length' \
            metrics/generated/tests.json)

          FAILED=$(jq -s \
            '[.[] | select(.Test != null and .Action == "fail")] | length' \
            metrics/generated/tests.json)

          TEST_TIME=$(jq -s \
            '[.[] |
              select(.Test != null and
              (.Action == "pass" or .Action == "fail")) |
              (.Elapsed // 0)] |
              add // 0' \
            metrics/generated/tests.json)

          COVERAGE=$(go tool cover \
            -func=metrics/generated/coverage.out |
            awk '/^total:/ {gsub("%", "", $3); print $3}')

          MAX_COMPLEXITY=$(gocyclo services |
            awk '
              NR == 1 { max = $1 }
              $1 > max { max = $1 }
              END { print max + 0 }
            ')

          COMMIT_SIZE=$(git show \
            --numstat \
            --format="" \
            HEAD |
            awk '
              $1 ~ /^[0-9]+$/ { added += $1 }
              $2 ~ /^[0-9]+$/ { deleted += $2 }
              END { print added + deleted }
            ')

          RUN_STARTED_AT=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" |
            jq -r '.run_started_at')

          START_TIMESTAMP=$(date -d "$RUN_STARTED_AT" +%s)
          CURRENT_TIMESTAMP=$(date +%s)
          PIPELINE_TIME=$((CURRENT_TIMESTAMP - START_TIMESTAMP))

          cat > metrics/generated/metrics.json << EOF
          {
            "commit": "${GITHUB_SHA}",
            "max_cyclomatic_complexity": ${MAX_COMPLEXITY},
            "coverage_percent": ${COVERAGE},
            "tests_passed": ${PASSED},
            "tests_failed": ${FAILED},
            "test_duration_seconds": ${TEST_TIME},
            "commit_size_lines": ${COMMIT_SIZE},
            "pipeline_duration_seconds": ${PIPELINE_TIME}
          }
          EOF

          {
            echo "## Quality metrics"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Max cyclomatic complexity | ${MAX_COMPLEXITY} |"
            echo "| Test coverage | ${COVERAGE}% |"
            echo "| Passed tests | ${PASSED} |"
            echo "| Failed tests | ${FAILED} |"
            echo "| Test duration | ${TEST_TIME} s |"
            echo "| Commit size | ${COMMIT_SIZE} lines |"
            echo "| Pipeline duration | ${PIPELINE_TIME} s |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TEST_EXIT" -ne 0 ]; then
            exit "$TEST_EXIT"
          fi

      - name: Upload quality metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-metrics
          path: metrics/generated/
