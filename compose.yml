include:
  - path: deploy/docker-compose.infrastructure.yml

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: monitoring-api
    restart: on-failure
    environment:
      API_LISTEN_ADDRESS: ":8080"
      API_GRPC_LISTEN_ADDRESS: ":9091"
      METRICS_GRPC_ADDRESS: metrics:9092
      POSTGRES_DSN: postgres://monitoring:monitoring@postgres:5432/monitoring?sslmode=disable
      PROTOTYPE_SERVICE_URL: https://example.com
      RABBITMQ_URL: amqp://monitoring:monitoring@rabbitmq:5672/
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      metrics:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8080/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  checker:
    build:
      context: .
      dockerfile: services/checker/Dockerfile
    container_name: monitoring-checker
    restart: on-failure
    environment:
      API_GRPC_ADDRESS: api:9091
      RABBITMQ_URL: amqp://monitoring:monitoring@rabbitmq:5672/
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: monitoring
      INFLUXDB_BUCKET: monitoring
      INFLUXDB_TOKEN: monitoring-test-token
    depends_on:
      api:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  metrics:
    build:
      context: .
      dockerfile: services/metrics/Dockerfile
    container_name: monitoring-metrics
    restart: on-failure
    environment:
      METRICS_GRPC_LISTEN_ADDRESS: ":9092"
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: monitoring
      INFLUXDB_BUCKET: monitoring
      INFLUXDB_TOKEN: monitoring-test-token
    depends_on:
      influxdb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: monitoring-web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
