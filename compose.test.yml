services:
  checker:
    restart: "no"

  scheduler:
    environment:
      SCHEDULER_INTERVAL: 10s
      SCHEDULER_CONFIG_SYNC_INTERVAL: 2s
      CHECKER_JOB_RETRY_DELAY: 1s
      CHECKER_JOB_TTL: 1m

  slow-test-service:
    build:
      context: .
      dockerfile: tests/http-fixture/Dockerfile
    environment:
      RESPONSE_DELAY: 8s

  updated-test-service:
    image: nginx:1.27-alpine
